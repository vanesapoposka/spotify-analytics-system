services:
  postgres:
    image: postgres:16
    container_name: spotify_dwh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spotify_dwh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spotify_pg_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data_vault:/data_vault:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spotify_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spotify_pg_data:
